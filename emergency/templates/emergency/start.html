{% extends "base.html" %}
{% load static %}

{% block title %}Emergency | SCC{% endblock %}

{% block extra_head %}
<style>
  .emergency-start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    cursor: pointer;
    text-align: center;
  }
  .emergency-icon {
    font-size: 8rem;
    line-height: 1;
    filter: drop-shadow(0 8px 16px rgba(255, 0, 0, 0.4));
    animation: pulse 1.5s infinite;
  }
  .emergency-label {
    font-size: 1.2rem;
    margin-top: 1rem;
    opacity: 0.7;
    letter-spacing: 2px;
    color: #b00020;  /* dark red */
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.9; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
{% endblock %}

{% block content %}
<div class="emergency-start" onclick="window.location.href='{% url 'emergency:threat' %}'">
  <div class="emergency-icon">🚨</div>
  <div class="emergency-label">EMERGENCY</div>
  <div style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.5;">tap anywhere</div>
</div>
{% endblock %}
